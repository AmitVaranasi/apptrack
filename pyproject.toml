[project]
name = "apptrack"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "authlib>=1.3.2",
    "httpx>=0.27.2",
    "itsdangerous>=2.2.0",
    "cryptography>=43.0.0",
    "asyncpg>=0.30.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.1",
    "google-api-python-client>=2.149.0",
    "google-genai>=1.0.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
]

[tool.vercel]
entrypoint = "app.main:app"
